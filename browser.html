<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doc_Lib 文档目录浏览器</title>
<style>
/* ======== CSS Variables / Theming ======== */
:root, [data-theme="light"] {
  --bg: #f5f5f7; --surface: #ffffff; --surface2: #fafafa; --border: #e0e0e0;
  --text: #1d1d1f; --text2: #6e6e73; --text3: #aeaeb2;
  --accent: #0071e3; --accent-hover: #0077ed; --accent-bg: #e8f0fe;
  --cat01: #e8384f; --cat02: #3b82f6; --cat03: #10b981; --cat04: #f59e0b; --cat05: #8b5cf6;
  --shadow: rgba(0,0,0,.08); --shadow2: rgba(0,0,0,.15);
  --row-hover: #f0f5ff; --row-selected: #e8f0fe; --badge-bg: #e8e8ed;
  --toast-bg: #1d1d1f; --toast-text: #fff;
}
[data-theme="dark"] {
  --bg: #1a1a1e; --surface: #2c2c2e; --surface2: #232326; --border: #3a3a3c;
  --text: #f5f5f7; --text2: #98989d; --text3: #636366;
  --accent: #0a84ff; --accent-hover: #409cff; --accent-bg: #1c3a5e;
  --cat01: #ff453a; --cat02: #0a84ff; --cat03: #30d158; --cat04: #ffd60a; --cat05: #bf5af2;
  --shadow: rgba(0,0,0,.3); --shadow2: rgba(0,0,0,.5);
  --row-hover: #2c3a50; --row-selected: #1c3a5e; --badge-bg: #3a3a3c;
  --toast-bg: #f5f5f7; --toast-text: #1d1d1f;
}

/* ======== Reset & Base ======== */
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); overflow:hidden; height:100vh; transition:background .3s,color .3s; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }

/* ======== Layout ======== */
.app { display:flex; flex-direction:column; height:100vh; }

/* Header */
.header { background:var(--surface); border-bottom:1px solid var(--border); padding:8px 16px; display:flex; align-items:center; gap:12px; flex-shrink:0; }
.header h1 { font-size:16px; font-weight:600; white-space:nowrap; }
.search-box { flex:1; max-width:420px; position:relative; }
.search-box input { width:100%; padding:7px 12px 7px 34px; border:1px solid var(--border); border-radius:8px; font-size:13px; background:var(--surface); color:var(--text); outline:none; transition:border .2s; }
.search-box input:focus { border-color:var(--accent); }
.search-box .icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text2); font-size:14px; }
.stats { font-size:12px; color:var(--text2); white-space:nowrap; }
.header-actions { display:flex; gap:6px; align-items:center; }
.icon-btn { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:5px 8px; cursor:pointer; font-size:13px; color:var(--text2); transition:all .15s; }
.icon-btn:hover { color:var(--text); border-color:var(--text2); }
.icon-btn.active { color:var(--accent); border-color:var(--accent); }
.extract-dir-row { display:flex; gap:6px; align-items:center; padding:4px 0 4px 0; }

/* Filter Bar */
.filter-bar { background:var(--surface); border-bottom:1px solid var(--border); padding:6px 16px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; flex-shrink:0; }
.filter-group { display:flex; align-items:center; gap:3px; }
.filter-group label { font-size:11px; color:var(--text2); margin-right:3px; white-space:nowrap; }
.cat-btn { padding:2px 9px; border:1px solid var(--border); border-radius:12px; font-size:11px; cursor:pointer; background:var(--surface); color:var(--text); transition:all .15s; user-select:none; }
.cat-btn.active { color:#fff; border-color:transparent; }
.cat-btn[data-cat="01"].active { background:var(--cat01); }
.cat-btn[data-cat="02"].active { background:var(--cat02); }
.cat-btn[data-cat="03"].active { background:var(--cat03); }
.cat-btn[data-cat="04"].active { background:var(--cat04); }
.cat-btn[data-cat="05"].active { background:var(--cat05); }
.sel { padding:2px 6px; border:1px solid var(--border); border-radius:5px; font-size:11px; background:var(--surface); color:var(--text); outline:none; max-width:140px; }
.divider { width:1px; height:18px; background:var(--border); margin:0 2px; }

/* Week Dropdown */
.week-dd { position:relative; }
.week-dd-btn { padding:2px 6px; border:1px solid var(--border); border-radius:5px; font-size:11px; background:var(--surface); color:var(--text); cursor:pointer; min-width:80px; display:flex; align-items:center; justify-content:space-between; gap:3px; }
.week-dd-list { position:absolute; top:100%; left:0; z-index:50; background:var(--surface); border:1px solid var(--border); border-radius:8px; box-shadow:0 4px 16px var(--shadow2); min-width:190px; max-height:280px; overflow-y:auto; display:none; margin-top:3px; }
.week-dd-list.open { display:block; }
.week-dd-list .item { padding:4px 9px; display:flex; align-items:center; gap:5px; font-size:11px; cursor:pointer; color:var(--text); }
.week-dd-list .item:hover { background:var(--row-hover); }
.week-dd-list .item label { cursor:pointer; display:flex; align-items:center; gap:5px; width:100%; }
.week-dd-list .item input { width:13px; height:13px; accent-color:var(--accent); }
.week-dd-list .act-row { padding:5px 9px; border-top:1px solid var(--border); display:flex; gap:8px; font-size:10px; }
.week-dd-list .act-row a { cursor:pointer; }

/* Active Filters */
.active-filters { background:var(--surface2); border-bottom:1px solid var(--border); padding:3px 16px; display:flex; align-items:center; gap:5px; flex-wrap:wrap; min-height:0; overflow:hidden; }
.active-filters.has-chips { min-height:24px; }
.chip { padding:1px 7px; border-radius:9px; font-size:10px; background:var(--badge-bg); color:var(--text); display:inline-flex; align-items:center; gap:3px; }
.chip .x { cursor:pointer; color:var(--text2); font-weight:bold; font-size:11px; }
.chip .x:hover { color:var(--text); }

/* ======== Table ======== */
.table-wrap { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.table-header { display:grid; grid-template-columns:36px 110px 80px 90px 1fr 42px 56px 80px 36px 70px; align-items:center; background:var(--surface); border-bottom:2px solid var(--border); flex-shrink:0; padding:0 6px; height:40px; user-select:none; }
.table-header .col { font-size:11px; font-weight:600; color:var(--text2); cursor:pointer; display:flex; align-items:center; gap:1px; padding:0 3px; white-space:nowrap; }
.table-header .col:hover { color:var(--text); }
.table-header .col .arrow { font-size:9px; }
.table-body { flex:1; overflow-y:auto; position:relative; }
.table-spacer { width:100%; }
.table-rows { position:absolute; top:0; left:0; right:0; padding:0 6px; }
.table-row { display:grid; grid-template-columns:36px 110px 80px 90px 1fr 42px 56px 80px 36px 70px; align-items:center; height:32px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .1s; font-size:12px; }
.table-row:hover { background:var(--row-hover); }
.table-row.selected { background:var(--row-selected); }
.table-row .cell { padding:0 3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.table-row .cell.week { font-size:11px; color:var(--text2); }
.table-row .cell.source { font-size:11px; color:var(--text2); }
.table-row .cell.filename { font-weight:500; }
.table-row .cell.pages { text-align:right; font-size:11px; color:var(--text2); }
.table-row .cell.size { text-align:right; font-size:11px; color:var(--text2); }
.table-row .cell.date { font-size:11px; color:var(--text2); }
.table-row .cell.ext { text-align:center; }
.table-row .cell.actions { display:flex; gap:3px; justify-content:center; }
.cat-tag { display:inline-block; padding:1px 7px; border-radius:9px; font-size:10px; color:#fff; font-weight:500; }
.cat-tag[data-cat="01"] { background:var(--cat01); }
.cat-tag[data-cat="02"] { background:var(--cat02); }
.cat-tag[data-cat="03"] { background:var(--cat03); }
.cat-tag[data-cat="04"] { background:var(--cat04); }
.cat-tag[data-cat="05"] { background:var(--cat05); }
.ext-badge { font-size:9px; padding:1px 4px; border-radius:3px; background:var(--badge-bg); color:var(--text2); }
.ext-badge.non-pdf { background:#fef3c7; color:#92400e; }
[data-theme="dark"] .ext-badge.non-pdf { background:#422006; color:#fbbf24; }
input[type="checkbox"] { width:14px; height:14px; cursor:pointer; accent-color:var(--accent); }
.btn-sm { padding:2px 6px; border:none; border-radius:3px; font-size:10px; cursor:pointer; transition:background .15s; }
.btn-open { background:#dbeafe; color:#1e40af; }
[data-theme="dark"] .btn-open { background:#1e3a5f; color:#93c5fd; }
.btn-extract { background:#dcfce7; color:#166534; }
[data-theme="dark"] .btn-extract { background:#14532d; color:#86efac; }
.btn-fav { background:transparent; border:none; cursor:pointer; font-size:13px; padding:0 2px; color:var(--text3); }
.btn-fav.is-fav { color:#f59e0b; }

/* Empty State */
.empty-state { text-align:center; padding:60px 20px; color:var(--text2); font-size:14px; }

/* ======== Bottom Bar ======== */
.bottom-bar { background:var(--surface); border-top:1px solid var(--border); padding:6px 16px; display:flex; align-items:center; gap:10px; flex-shrink:0; min-height:0; overflow:hidden; }
.bottom-bar.visible { min-height:42px; }
.sel-count { font-size:12px; font-weight:500; }
.sel-size { font-size:11px; color:var(--text2); }
.btn { padding:6px 14px; border:none; border-radius:6px; font-size:12px; font-weight:500; cursor:pointer; transition:all .15s; }
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { background:var(--accent-hover); }
.btn-primary:disabled { opacity:.5; cursor:not-allowed; }
.btn-secondary { background:var(--badge-bg); color:var(--text); }
.btn-clear { background:transparent; color:var(--text2); font-size:11px; }

/* ======== Panels ======== */
.overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.35); z-index:100; display:none; }
.overlay.visible { display:block; }
.panel { position:fixed; top:0; right:0; width:400px; height:100vh; background:var(--surface); box-shadow:-4px 0 24px var(--shadow2); z-index:101; transform:translateX(100%); transition:transform .25s ease; overflow-y:auto; padding:20px; }
.panel.visible { transform:translateX(0); }
.panel h2 { font-size:14px; margin-bottom:14px; line-height:1.5; word-break:break-all; }
.panel .field { margin-bottom:10px; }
.panel .field .label { font-size:10px; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; margin-bottom:2px; }
.panel .field .value { font-size:13px; }
.panel .panel-actions { margin-top:16px; display:flex; gap:6px; flex-wrap:wrap; }
.panel-close { position:absolute; top:14px; right:14px; background:none; border:none; font-size:18px; cursor:pointer; color:var(--text2); }

/* ======== Dialog ======== */
.dialog-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.35); z-index:200; display:none; }
.dialog-overlay.visible { display:flex; align-items:center; justify-content:center; }
.dialog { background:var(--surface); border-radius:12px; padding:20px; width:480px; max-height:80vh; overflow-y:auto; box-shadow:0 8px 32px var(--shadow2); }
.dialog h3 { font-size:15px; margin-bottom:14px; }
.dialog .file-list { max-height:180px; overflow-y:auto; border:1px solid var(--border); border-radius:5px; margin-bottom:10px; font-size:11px; }
.dialog .file-list div { padding:3px 7px; border-bottom:1px solid var(--border); }
.dialog .field { margin-bottom:10px; }
.dialog .field label { display:block; font-size:12px; margin-bottom:3px; }
.dialog .field input { width:100%; padding:6px 8px; border:1px solid var(--border); border-radius:5px; font-size:12px; background:var(--surface); color:var(--text); outline:none; }
.dialog .field input:focus { border-color:var(--accent); }
.dialog .actions { display:flex; justify-content:flex-end; gap:6px; margin-top:14px; }
.progress-bar { width:100%; height:6px; background:var(--badge-bg); border-radius:3px; overflow:hidden; margin-top:6px; }
.progress-bar .fill { height:100%; background:var(--accent); transition:width .3s; border-radius:3px; }
.progress-text { font-size:11px; color:var(--text2); margin-top:3px; }

/* ======== Stats Panel ======== */
.stats-panel { position:fixed; top:0; right:0; width:520px; height:100vh; background:var(--surface); box-shadow:-4px 0 24px var(--shadow2); z-index:101; transform:translateX(100%); transition:transform .25s ease; overflow-y:auto; padding:20px; }
.stats-panel.visible { transform:translateX(0); }
.stats-panel h2 { font-size:15px; margin-bottom:14px; }
.stats-chart { margin-bottom:20px; }
.stats-chart h3 { font-size:12px; color:var(--text2); margin-bottom:8px; }
.bar-row { display:flex; align-items:center; gap:8px; margin-bottom:3px; font-size:11px; }
.bar-label { width:100px; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text2); }
.bar-track { flex:1; height:16px; background:var(--badge-bg); border-radius:3px; overflow:hidden; position:relative; }
.bar-fill { height:100%; border-radius:3px; transition:width .3s; }
.bar-value { position:absolute; right:4px; top:1px; font-size:9px; color:var(--text2); }

/* ======== Toast ======== */
.toast-container { position:fixed; top:12px; right:12px; z-index:400; display:flex; flex-direction:column; gap:6px; pointer-events:none; }
.toast { padding:8px 14px; border-radius:6px; font-size:12px; color:var(--toast-text); background:var(--toast-bg); box-shadow:0 4px 12px var(--shadow2); pointer-events:auto; opacity:0; transform:translateX(20px); animation:toast-in .2s ease forwards; max-width:320px; word-break:break-all; }
.toast.error { background:#dc2626; color:#fff; }
[data-theme="dark"] .toast { background:#f5f5f7; color:#1d1d1f; }
[data-theme="dark"] .toast.error { background:#dc2626; color:#fff; }
@keyframes toast-in { to { opacity:1; transform:translateX(0); } }
@keyframes toast-out { to { opacity:0; transform:translateX(20px); } }

/* Loading */
.loading { position:fixed; top:0; left:0; right:0; bottom:0; background:var(--surface); display:flex; align-items:center; justify-content:center; z-index:300; flex-direction:column; gap:14px; }
.loading .spinner { width:28px; height:28px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="loading" id="loading"><div class="spinner"></div><div>正在加载目录数据...</div></div>
<div class="toast-container" id="toastContainer"></div>

<div class="app" id="app" style="display:none">
  <!-- Header -->
  <div class="header">
    <h1>Doc_Lib</h1>
    <div class="search-box">
      <span class="icon">&#128269;</span>
      <input type="text" id="searchInput" placeholder="搜索文件名或内容..." />
    </div>
    <div class="stats" id="statsText">加载中...</div>
    <div class="header-actions">
      <button class="icon-btn" id="favFilterBtn" title="仅显示收藏" onclick="toggleFavFilter()">&#9734;</button>
      <button class="icon-btn" id="historyBtn" title="浏览历史" onclick="showHistory()">&#128337;</button>
      <button class="icon-btn" id="addDataBtn" title="添加新数据" onclick="showUploadDialog()">+</button>
      <button class="icon-btn" id="statsBtn" title="来源统计" onclick="showStats()">&#128202;</button>
      <button class="icon-btn" id="extractDirBtn" title="设置提取目录" onclick="toggleExtractDir()">&#128193;</button>
      <button class="icon-btn" id="darkModeBtn" title="切换暗色模式" onclick="toggleDarkMode()">&#9790;</button>
    </div>
    <div class="extract-dir-row" id="extractDirRow" style="display:none">
      <span style="font-size:12px;color:var(--text2);white-space:nowrap">提取到&#8201;</span>
      <input type="text" id="extractDirInput" style="flex:1;font-size:12px;padding:2px 6px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);min-width:160px" />
      <button class="btn-sm btn-extract" onclick="openExtractDir()" title="打开目录">&#128194;</button>
    </div>
  </div>

  <!-- Filter Bar -->
  <div class="filter-bar">
    <div class="filter-group">
      <label>周次</label>
      <div class="week-dd" id="weekDd">
        <div class="week-dd-btn" id="weekDdBtn">全部周次 &#9662;</div>
        <div class="week-dd-list" id="weekDdList"></div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="filter-group">
      <label>分类</label>
      <button class="cat-btn active" data-cat="01">重点</button>
      <button class="cat-btn active" data-cat="02">券商</button>
      <button class="cat-btn active" data-cat="03">投行</button>
      <button class="cat-btn active" data-cat="04">小报告</button>
      <button class="cat-btn active" data-cat="05">杂货</button>
    </div>
    <div class="divider"></div>
    <div class="filter-group" id="sourceGroup" style="display:none">
      <label>来源</label>
      <select class="sel" id="sourceSel"><option value="">全部</option></select>
    </div>
    <div class="divider" id="sourceDivider" style="display:none"></div>
    <div class="filter-group">
      <label>类型</label>
      <select class="sel" id="extSel"><option value="">全部</option></select>
    </div>
  </div>

  <div class="active-filters" id="activeFilters"></div>

  <!-- Table -->
  <div class="table-wrap">
    <div class="table-header" id="tableHeader">
      <div class="col"><input type="checkbox" id="selectAll" title="全选" /></div>
      <div class="col" data-sort="week">周次 <span class="arrow"></span></div>
      <div class="col" data-sort="cat_num">分类 <span class="arrow"></span></div>
      <div class="col" data-sort="source">来源 <span class="arrow"></span></div>
      <div class="col" data-sort="filename">文件名 <span class="arrow"></span></div>
      <div class="col" data-sort="pages">页</div>
      <div class="col" data-sort="size">大小 <span class="arrow"></span></div>
      <div class="col" data-sort="date">日期 <span class="arrow"></span></div>
      <div class="col">类型</div>
      <div class="col">操作</div>
    </div>
    <div class="table-body" id="tableBody">
      <div class="table-spacer" id="tableSpacer"></div>
      <div class="table-rows" id="tableRows"></div>
    </div>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar" id="bottomBar">
    <span class="sel-count" id="selCount"></span>
    <span class="sel-size" id="selSize"></span>
    <button class="btn btn-primary" id="batchBtn" disabled>批量提取</button>
    <button class="btn-clear" id="clearSelBtn">清除选择</button>
  </div>
</div>

<!-- Detail Panel -->
<div class="overlay" id="detailOverlay"></div>
<div class="panel" id="detailPanel">
  <button class="panel-close" id="detailClose">&times;</button>
  <h2 id="detailTitle"></h2>
  <div id="detailContent"></div>
</div>

<!-- Stats Panel -->
<div class="overlay" id="statsOverlay"></div>
<div class="stats-panel" id="statsPanel">
  <button class="panel-close" id="statsClose">&times;</button>
  <h2>来源统计</h2>
  <div id="statsContent"></div>
</div>

<!-- Batch Dialog -->
<div class="dialog-overlay" id="batchDialog">
  <div class="dialog">
    <h3>批量提取文件</h3>
    <div class="file-list" id="batchFileList"></div>
    <div class="field">
      <label>提取到目录（自动创建时间戳子目录）</label>
      <input type="text" id="batchTargetDir" />
    </div>
    <div class="field" style="font-size:11px;color:var(--text2);margin-bottom:8px">
      实际提取到: <span id="batchActualDir" style="font-family:monospace;font-size:10px"></span>
    </div>
    <div class="field">
      <label>预设目录</label>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:3px">
        <button class="btn-sm btn-secondary" onclick="setBatchDir('D:\\Doc_Lib\\extracted')">Doc_Lib</button>
        <button class="btn-sm btn-secondary" onclick="setBatchDir(getExtractDir()+'\\券商')">券商</button>
        <button class="btn-sm btn-secondary" onclick="setBatchDir(getExtractDir()+'\\投行')">投行</button>
        <button class="btn-sm btn-secondary" onclick="setBatchDir(getExtractDir())">提取目录</button>
      </div>
    </div>
    <div id="batchProgress" style="display:none">
      <div class="progress-bar"><div class="fill" id="batchProgressFill"></div></div>
      <div class="progress-text" id="batchProgressText"></div>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" id="batchCancelBtn">取消</button>
      <button class="btn btn-primary" id="batchStartBtn">开始提取</button>
    </div>
  </div>
</div>

<!-- Upload Dialog -->
<div class="dialog-overlay" id="uploadDialog">
  <div class="dialog">
    <h3>添加新数据</h3>
    <div class="field">
      <label>选择 ZIP 文件</label>
      <div style="border:2px dashed var(--border);border-radius:8px;padding:24px;text-align:center;cursor:pointer;margin-top:4px;transition:border .2s"
           id="uploadDropZone"
           ondragover="this.style.borderColor='var(--accent)';event.preventDefault()"
           ondragleave="this.style.borderColor='var(--border)'"
           ondrop="handleFileDrop(event)"
           onclick="document.getElementById('uploadFileInput').click()">
        <div style="font-size:28px;margin-bottom:6px">&#128230;</div>
        <div style="font-size:13px;color:var(--text)" id="uploadFileName">拖拽 ZIP 文件到此处或点击选择</div>
        <div style="font-size:11px;color:var(--text2);margin-top:4px">仅支持 .zip 文件，大小约 3–5 GB</div>
        <input type="file" id="uploadFileInput" accept=".zip" style="display:none" onchange="handleFileSelect(event)" />
      </div>
    </div>
    <div class="field">
      <label>周次标签</label>
      <input type="text" id="uploadWeekLabel" placeholder="例如：2026年4月第4周" />
      <div style="font-size:10px;color:var(--text2);margin-top:2px">留空则自动从文件名提取。格式：YYYY年M月第W周</div>
    </div>
    <div id="uploadProgress" style="display:none">
      <div class="progress-bar"><div class="fill" id="uploadProgressFill"></div></div>
      <div class="progress-text" id="uploadProgressText"></div>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" id="uploadCancelBtn">取消</button>
      <button class="btn btn-primary" id="uploadStartBtn" disabled>上传并添加到目录</button>
    </div>
  </div>
</div>

<!-- History Panel -->
<div class="overlay" id="historyOverlay"></div>
<div class="panel" id="historyPanel">
  <button class="panel-close" id="historyClose">&times;</button>
  <h2>浏览历史</h2>
  <div id="historyContent"></div>
</div>

<script>
// ======== STATE ========
let allItems=[], filteredItems=[], weekOrder=[], wpIdx={};
let selectedIds=new Set(), sortCols=[{col:'date',dir:'desc'}], searchQuery='';
let activeCats=new Set(['01','02','03','04','05']), activeSource='', activeExt='', showFavOnly=false;
let favoritesSet=new Set(); // work_path keys

const ROW_H=32, BUFFER=12;
const CAT_NAMES={'01':'重点报告','02':'国内券商','03':'投行报告','04':'小报告','05':'杂货'};
const CAT_COLORS={'01':'var(--cat01)','02':'var(--cat02)','03':'var(--cat03)','04':'var(--cat04)','05':'var(--cat05)'};

// ======== INIT ========
async function init(){
  try{
    const [catalogResp, favResp] = await Promise.all([
      fetch('/api/catalog'),
      fetch('/api/favorites'),
    ]);
    allItems = await catalogResp.json();
    const favs = await favResp.json();
    favs.forEach(f => favoritesSet.add(f.work_path));

    allItems.forEach((c,i) => wpIdx[c.work_path]=i);
    const ws = new Set(allItems.map(c=>c.week));
    weekOrder = [...ws].sort((a,b)=>{
      const ma=a.match(/(\d+)年(\d+)月第(\d+)周/), mb=b.match(/(\d+)年(\d+)月第(\d+)周/);
      if(!ma||!mb) return a.localeCompare(b);
      return (ma[1]-mb[1])||(ma[2]-mb[2])||(ma[3]-mb[3]);
    });
    buildFilters(); applyFilters();
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='flex';
    // Init dark mode from localStorage
    if(localStorage.getItem('doclib-theme')==='dark'){ document.documentElement.dataset.theme='dark'; document.getElementById('darkModeBtn').classList.add('active'); }
  }catch(e){
    document.getElementById('loading').innerHTML='<div style="color:red">加载失败: '+e.message+'<br>请确保 server.py 正在运行</div>';
  }
}

// ======== FILTERS ========
function buildFilters(){
  const wl=document.getElementById('weekDdList');
  let h='<div class="act-row"><a onclick="weekSelAll()">全选</a><a onclick="weekSelNone()">清空</a></div>';
  weekOrder.forEach(w=>{
    const cnt=allItems.filter(c=>c.week===w).length;
    h+=`<div class="item"><label><input type="checkbox" value="${esc(w)}" checked /> ${esc(w)} (${cnt})</label></div>`;
  });
  wl.innerHTML=h;
  wl.querySelectorAll('input[type="checkbox"]').forEach(cb=>cb.addEventListener('change',()=>{updateWeekBtn();applyFilters();}));
  updateWeekBtn();

  const exts={};
  allItems.forEach(c=>{exts[c.ext]=(exts[c.ext]||0)+1;});
  const es=document.getElementById('extSel');
  es.innerHTML='<option value="">全部</option>';
  Object.entries(exts).sort((a,b)=>b[1]-a[1]).forEach(([e,n])=>{const o=document.createElement('option');o.value=e;o.textContent=`${e} (${n})`;es.appendChild(o);});
  updateSourceFilter();
}

function updateWeekBtn(){
  const btn=document.getElementById('weekDdBtn'), list=document.getElementById('weekDdList');
  const ck=list.querySelectorAll('input:checked').length, tot=weekOrder.length;
  btn.innerHTML=(ck===0||ck===tot)?`全部周次 &#9662;`:`${ck}/${tot} 周 &#9662;`;
}
function weekSelAll(){document.getElementById('weekDdList').querySelectorAll('input[type="checkbox"]').forEach(c=>c.checked=true);updateWeekBtn();applyFilters();}
function weekSelNone(){document.getElementById('weekDdList').querySelectorAll('input[type="checkbox"]').forEach(c=>c.checked=false);updateWeekBtn();applyFilters();}
function clearWeekFilter(){weekSelAll();}

function updateSourceFilter(){
  const show=activeCats.has('02')||activeCats.has('03');
  document.getElementById('sourceGroup').style.display=show?'':'none';
  document.getElementById('sourceDivider').style.display=show?'':'none';
  const ss=document.getElementById('sourceSel');const src={};
  allItems.forEach(c=>{if((activeCats.has('02')&&c.cat_num==='02')||(activeCats.has('03')&&c.cat_num==='03')){if(c.source)src[c.source]=(src[c.source]||0)+1;}});
  ss.innerHTML='<option value="">全部</option>';
  Object.entries(src).sort((a,b)=>b[1]-a[1]).forEach(([s,n])=>{const o=document.createElement('option');o.value=s;o.textContent=`${s} (${n})`;ss.appendChild(o);});
  activeSource='';
}

function applyFilters(){
  let items=allItems;
  if(activeCats.size<5) items=items.filter(c=>activeCats.has(c.cat_num));
  // Week
  const wl=document.getElementById('weekDdList');
  const checked=new Set([...wl.querySelectorAll('input:checked')].map(c=>c.value));
  if(checked.size===0) items=[];
  else if(checked.size<weekOrder.length) items=items.filter(c=>checked.has(c.week));
  if(activeSource) items=items.filter(c=>c.source===activeSource);
  if(activeExt) items=items.filter(c=>c.ext===activeExt);
  if(showFavOnly) items=items.filter(c=>favoritesSet.has(c.work_path));
  if(searchQuery){const q=searchQuery.toLowerCase();items=items.filter(c=>c.filename.toLowerCase().includes(q));}
  filteredItems=items; applySort();
  renderActiveFilters(); updateStats();
  document.getElementById('tableBody').scrollTop=0;
  renderTable();
}

function applySort(){
  filteredItems.sort((a,b)=>{
    for(let i=0;i<sortCols.length;i++){
      const s=sortCols[i];
      const dir=s.dir==='asc'?1:-1;
      let va=a[s.col],vb=b[s.col];
      if(s.col==='size'||s.col==='pages'){
        va=va||0;vb=vb||0;
        const diff=(va-vb)*dir;
        if(diff!==0)return diff;
        continue;
      }
      if(s.col==='week'){
        const ma=va.match(/(\d+)年(\d+)月第(\d+)周/),mb=vb.match(/(\d+)年(\d+)月第(\d+)周/);
        if(ma&&mb){const cmp=(ma[1]-mb[1])||(ma[2]-mb[2])||(ma[3]-mb[3]);if(cmp!==0)return cmp*dir;}
      }
      va=(va||'').toString().toLowerCase();vb=(vb||'').toString().toLowerCase();
      const cmp=va.localeCompare(vb,'zh');if(cmp!==0)return cmp*dir;
    }
    return 0;
  });
}

function updateStats(){
  document.getElementById('statsText').textContent=`显示 ${filteredItems.length.toLocaleString()} / ${allItems.length.toLocaleString()}`;
}

function renderActiveFilters(){
  const el=document.getElementById('activeFilters');let h='';
  if(searchQuery) h+=`<span class="chip">搜索: ${esc(searchQuery)} <span class="x" onclick="clearSearch()">x</span></span>`;
  if(showFavOnly) h+=`<span class="chip" style="background:#fef3c7;color:#92400e">仅收藏 <span class="x" onclick="toggleFavFilter()">x</span></span>`;
  if(activeCats.size<5) activeCats.forEach(c=>h+=`<span class="chip" style="background:${CAT_COLORS[c]};color:#fff">${CAT_NAMES[c]} <span class="x" onclick="toggleCat('${c}')">x</span></span>`);
  {const wl=document.getElementById('weekDdList');const ck=[...wl.querySelectorAll('input:checked')].length;
   if(ck>0&&ck<weekOrder.length) h+=`<span class="chip">周次: ${ck}/${weekOrder.length} <span class="x" onclick="clearWeekFilter()">x</span></span>`;}
  if(activeSource) h+=`<span class="chip">来源: ${esc(activeSource)} <span class="x" onclick="clearSourceFilter()">x</span></span>`;
  if(activeExt) h+=`<span class="chip">类型: ${activeExt} <span class="x" onclick="clearExtFilter()">x</span></span>`;
  el.innerHTML=h; el.classList.toggle('has-chips',h.length>0);
}

// ======== VIRTUAL TABLE ========
function renderTable(){
  const body=document.getElementById('tableBody'),spacer=document.getElementById('tableSpacer'),rows=document.getElementById('tableRows');
  if(filteredItems.length===0){spacer.style.height='0';rows.style.transform='translateY(0)';rows.innerHTML='<div class="empty-state">无匹配结果，请调整筛选条件</div>';return;}
  spacer.style.height=filteredItems.length*ROW_H+'px';
  const top=body.scrollTop,viewH=body.clientHeight;
  let start=Math.max(0,Math.floor(top/ROW_H)-BUFFER), end=Math.min(filteredItems.length,Math.ceil((top+viewH)/ROW_H)+BUFFER);
  rows.style.transform=`translateY(${start*ROW_H}px)`;
  let html='';
  for(let i=start;i<end;i++){
    const c=filteredItems[i],id=wpIdx[c.work_path],sel=selectedIds.has(id),fav=favoritesSet.has(c.work_path);
    const ws=c.week.replace(/^\d+年/,''),ec=c.ext==='.pdf'?'ext-badge':'ext-badge non-pdf';
    html+=`<div class="table-row${sel?' selected':''}" data-idx="${id}">
      <div class="cell"><input type="checkbox" ${sel?'checked':''} onclick="event.stopPropagation();toggleSel(${id})" /></div>
      <div class="cell week">${esc(ws)}</div>
      <div class="cell cat"><span class="cat-tag" data-cat="${c.cat_num}">${CAT_NAMES[c.cat_num]}</span></div>
      <div class="cell source">${esc(c.source)}</div>
      <div class="cell filename" title="${esc(c.filename)}">${esc(c.filename)}</div>
      <div class="cell pages">${c.pages||'--'}</div>
      <div class="cell size">${fmtSize(c.size)}</div>
      <div class="cell date">${c.date}</div>
      <div class="cell"><span class="${ec}">${c.ext.replace('.','')}</span></div>
      <div class="cell actions">
        <button class="btn-fav${fav?' is-fav':''}" onclick="event.stopPropagation();toggleFav(${id})" title="收藏">${fav?'★':'☆'}</button>
        <button class="btn-sm btn-open" data-idx="${id}" data-wp="${esc(c.work_path)}" onclick="event.stopPropagation();openFile(this)">打开</button>
        <button class="btn-sm btn-extract" data-idx="${id}" data-wp="${esc(c.work_path)}" onclick="event.stopPropagation();extractFile(this)">提取</button>
      </div>
    </div>`;
  }
  rows.innerHTML=html;
  rows.querySelectorAll('.table-row').forEach(r=>{
    r.addEventListener('click',e=>{
      if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON') return;
      showDetail(parseInt(r.dataset.idx));
    });
  });
  // Sort arrows
  document.querySelectorAll('#tableHeader .col[data-sort]').forEach(col=>{
    const arrow=col.querySelector('.arrow');if(!arrow)return;
    const first=sortCols.find(s=>s.col===col.dataset.sort);
    arrow.textContent=first?(first.dir==='asc'?' ▲':' ▼'):'';
  });
}

let rafId;
function onScroll(){if(rafId)cancelAnimationFrame(rafId);rafId=requestAnimationFrame(renderTable);}

// ======== ACTIONS ========
function resolveItem(el){
  // Accept element, numeric index, or work_path string.
  let idxNum, wpStr;
  if(typeof el==='number'){idxNum=el;wpStr=null;}
  else if(typeof el==='string'){idxNum=null;wpStr=el;}
  else if(el&&el.dataset){idxNum=parseInt(el.dataset.idx);wpStr=el.dataset.wp;}
  else{showToast('resolveItem: invalid argument',true);return null;}
  const byIdx=idxNum>=0?allItems[idxNum]:null;
  const byWp=wpStr?allItems[wpIdx[wpStr]]:null;
  if(byIdx&&byWp&&byIdx!==byWp){
    console.error('RESOLVE MISMATCH','idxNum='+idxNum,'wpStr='+wpStr,
      'byIdx='+byIdx.filename,'byWp='+(byWp?byWp.filename:'null'));
    showToast('BUG! resolve mismatch: '+byIdx.filename+' vs '+(byWp?byWp.filename:'null'),true);
  }
  if(!byIdx&&!byWp){
    showToast('错误: 索引无效 idx='+idxNum+' wp='+wpStr,true);
    return null;
  }
  const c=byIdx||byWp;
  console.log('resolveItem','idxNum='+idxNum,'wpStr='+wpStr,'file='+c.filename,'work_path='+c.work_path);
  return c;
}
async function openFile(el){
  const c=resolveItem(el); if(!c)return;
  showToast('打开: '+c.filename);
  try{const r=await fetch('/api/open?work_path='+encodeURIComponent(c.work_path));const d=await r.json();if(d.error)showToast(d.error,true);}catch(e){showToast(e.message,true);}
}
async function extractFile(el){
  const c=resolveItem(el); if(!c)return;
  showToast('提取: '+c.filename+' → '+getExtractDir());
  const td=encodeURIComponent(getExtractDir());
  try{const r=await fetch('/api/extract?work_path='+encodeURIComponent(c.work_path)+'&target_dir='+td);const d=await r.json();if(d.error)showToast(d.error,true);else{console.log('extract result',d);showToast('已提取: '+d.filename);}}catch(e){showToast(e.message,true);}
}

async function toggleFav(idx){
  const c=allItems[idx], key=c.work_path;
  if(favoritesSet.has(key)){
    favoritesSet.delete(key);
    await fetch(`/api/favorites?work_path=${encodeURIComponent(c.work_path)}`,{method:'DELETE'});
  } else {
    favoritesSet.add(key);
    await fetch('/api/favorites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:c.filename,work_path:c.work_path})});
  }
  renderTable();
}

function toggleSel(idx){selectedIds.has(idx)?selectedIds.delete(idx):selectedIds.add(idx);updateSelection();renderTable();}
function updateSelection(){
  const bar=document.getElementById('bottomBar'),cnt=selectedIds.size;
  bar.classList.toggle('visible',cnt>0);
  document.getElementById('selCount').textContent=cnt>0?`已选 ${cnt} 项`:'';
  const ts=[...selectedIds].reduce((s,i)=>s+(i<allItems.length?allItems[i].size:0),0);
  document.getElementById('selSize').textContent=cnt>0?`(${fmtSize(ts)})`:'';
  document.getElementById('batchBtn').disabled=cnt===0;
  document.getElementById('selectAll').checked=cnt>0&&cnt===filteredItems.length;
}

function showDetail(idx){
  const c=allItems[idx],fav=favoritesSet.has(c.work_path);
  document.getElementById('detailTitle').textContent=c.filename;
  let h='';
  [['周次',c.week],['分类',CAT_NAMES[c.cat_num]],['来源',c.source||'--'],['语言',c.lang],['页数',c.pages?c.pages+' 页':'--'],['大小',fmtSize(c.size)],['日期',c.date],['类型',c.ext.replace('.','').toUpperCase()],['路径',c.work_path]].forEach(([l,v])=>{
    h+=`<div class="field"><div class="label">${l}</div><div class="value">${esc(String(v))}</div></div>`;
  });
  h+=`<div class="panel-actions">
    <button class="btn btn-primary" data-idx="${idx}" data-wp="${esc(c.work_path)}" onclick="openFile(this)">打开</button>
    <button class="btn btn-secondary" data-idx="${idx}" data-wp="${esc(c.work_path)}" onclick="extractFile(this)">提取</button>
    <button class="btn btn-secondary" data-idx="${idx}" data-wp="${esc(c.work_path)}" onclick="previewPDF(this)">PDF预览</button>
    <button class="btn btn-secondary" onclick="toggleFav(${idx});showDetail(${idx})">${fav?'取消收藏':'收藏'}</button>
  </div>`;
  document.getElementById('detailContent').innerHTML=h;
  document.getElementById('detailPanel').classList.add('visible');
  document.getElementById('detailOverlay').classList.add('visible');
}
function closeDetail(){document.getElementById('detailPanel').classList.remove('visible');document.getElementById('detailOverlay').classList.remove('visible');}

async function previewPDF(el){
  const c=resolveItem(el); if(!c)return;
  if(c.ext!=='.pdf'){showToast('仅支持PDF预览',true);return;}
  try{const r=await fetch('/api/file?work_path='+encodeURIComponent(c.work_path));window.open(r.url,'_blank');}catch(e){showToast(e.message,true);}
}

// ======== EXTRACT DIR ========
const EXTRACT_DIR_KEY='doclib_extract_dir';
function getExtractDir(){
  let v=localStorage.getItem(EXTRACT_DIR_KEY);
  if(!v||!v.trim()){v='D:\\Doc_Lib\\extracted';localStorage.setItem(EXTRACT_DIR_KEY,v);}
  return v;
}
function saveExtractDir(v){localStorage.setItem(EXTRACT_DIR_KEY,v.trim());}
function toggleExtractDir(){
  const row=document.getElementById('extractDirRow');
  const show=row.style.display==='none';
  row.style.display=show?'flex':'none';
  if(show){
    document.getElementById('extractDirInput').value=getExtractDir();
    document.getElementById('extractDirInput').focus();
  }
}
function openExtractDir(){
  const d=getExtractDir();
  fetch(`/api/open-dir?path=${encodeURIComponent(d)}`).catch(()=>{});
  showToast('提取目录: '+d);
}
document.addEventListener('DOMContentLoaded',()=>{
  const inp=document.getElementById('extractDirInput');
  inp.value=getExtractDir();
  inp.addEventListener('change',()=>saveExtractDir(inp.value));
  inp.addEventListener('blur',()=>saveExtractDir(inp.value));
});

// ======== BATCH ========
function showBatchDialog(){
  const items=[...selectedIds].map(i=>allItems[i]).filter(Boolean);if(!items.length)return;
  document.getElementById('batchFileList').innerHTML=items.map(c=>`<div>${esc(c.filename)} <span style="color:var(--text2)">(${fmtSize(c.size)})</span></div>`).join('');
  const dir=getExtractDir();
  document.getElementById('batchTargetDir').value=dir;
  updateBatchActualDir();
  document.getElementById('batchProgress').style.display='none';
  document.getElementById('batchStartBtn').disabled=false;
  document.getElementById('batchDialog').classList.add('visible');
  document.getElementById('batchTargetDir').addEventListener('input',updateBatchActualDir,{once:true});
}
function setBatchDir(v){document.getElementById('batchTargetDir').value=v;updateBatchActualDir();}
function updateBatchActualDir(){
  const td=document.getElementById('batchTargetDir').value.trim();
  const ts=new Date().toISOString().replace(/[-:]/g,'').replace('T','_').slice(0,15);
  document.getElementById('batchActualDir').textContent=td+'\\'+ts;
}
async function startBatchExtract(){
  const items=[...selectedIds].map(i=>allItems[i]).filter(Boolean),td=document.getElementById('batchTargetDir').value.trim();
  if(!td){showToast('请输入目标目录',true);return;}
  document.getElementById('batchStartBtn').disabled=true;
  document.getElementById('batchProgress').style.display='block';
  try{
    const r=await fetch('/api/batch-extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:items.map(c=>({work_path:c.work_path})),target_dir:td})});
    const d=await r.json();if(d.error){showToast(d.error,true);return;}
    const tid=d.task_id;
    const poll=async()=>{const pr=await fetch(`/api/batch-progress?task_id=${tid}`);const p=await pr.json();const pct=p.total>0?Math.round(p.done/p.total*100):0;
      document.getElementById('batchProgressFill').style.width=pct+'%';
      document.getElementById('batchProgressText').textContent=`${p.done}/${p.total} (${pct}%)`+(p.errors?.length?` | ${p.errors.length} 错误`:'');
      if(p.status==='done'){showToast(`提取完成! ${p.done} 文件 -> ${p.batch_dir||td}`);closeBatchDialog();}else setTimeout(poll,500);};
    setTimeout(poll,500);
  }catch(e){showToast(e.message,true);document.getElementById('batchStartBtn').disabled=false;}
}
function closeBatchDialog(){document.getElementById('batchDialog').classList.remove('visible');}

// ======== FAVORITES FILTER ========
function toggleFavFilter(){
  showFavOnly=!showFavOnly;
  document.getElementById('favFilterBtn').classList.toggle('active',showFavOnly);
  document.getElementById('favFilterBtn').textContent=showFavOnly?'★':'☆';
  applyFilters();
}

// ======== UPLOAD ========
let uploadFile=null;

function showUploadDialog(){
  uploadFile=null;
  document.getElementById('uploadFileName').innerHTML='拖拽 ZIP 文件到此处或点击选择';
  document.getElementById('uploadWeekLabel').value='';
  document.getElementById('uploadStartBtn').disabled=true;
  document.getElementById('uploadProgress').style.display='none';
  document.getElementById('uploadDialog').classList.add('visible');
}

function closeUploadDialog(){
  document.getElementById('uploadDialog').classList.remove('visible');
}

function handleFileSelect(e){
  if(e.target.files.length>0) setUploadFile(e.target.files[0]);
}

function handleFileDrop(e){
  e.preventDefault();
  document.getElementById('uploadDropZone').style.borderColor='var(--border)';
  if(e.dataTransfer.files.length>0) setUploadFile(e.dataTransfer.files[0]);
}

function setUploadFile(file){
  if(!file.name.toLowerCase().endsWith('.zip')){
    showToast('仅支持 .zip 文件', true);
    return;
  }
  uploadFile=file;
  document.getElementById('uploadFileName').innerHTML='<b>'+esc(file.name)+'</b><br><span style="font-size:11px;color:var(--text2)">'+fmtSize(file.size)+'</span>';
  document.getElementById('uploadStartBtn').disabled=false;
  // Auto-fill week label from filename
  var m=file.name.match(/(\d{4}年\d{1,2}月第\d{1,2}周)/);
  if(m) document.getElementById('uploadWeekLabel').value=m[1];
}

async function startUpload(){
  if(!uploadFile) return;
  var btn=document.getElementById('uploadStartBtn');
  btn.disabled=true;
  document.getElementById('uploadProgress').style.display='block';

  var formData=new FormData();
  formData.append('file', uploadFile);
  var wl=document.getElementById('uploadWeekLabel').value.trim();
  if(wl) formData.append('week_label', wl);

  var xhr=new XMLHttpRequest();
  xhr.open('POST', '/api/upload');

  xhr.upload.onprogress=function(e){
    if(e.lengthComputable){
      var pct=Math.round(e.loaded/e.total*100);
      document.getElementById('uploadProgressFill').style.width=pct+'%';
      document.getElementById('uploadProgressText').textContent='上传中 '+fmtSize(e.loaded)+' / '+fmtSize(e.total)+' ('+pct+'%)';
    }
  };

  xhr.onload=function(){
    if(xhr.status===200){
      var d=JSON.parse(xhr.responseText);
      document.getElementById('uploadProgressFill').style.width='100%';
      document.getElementById('uploadProgressText').textContent='已添加 '+d.new_entries+' 个文件到 '+d.week_label;
      showToast('添加成功: '+d.new_entries+' 个文件');
      // Reload catalog after a short delay
      setTimeout(function(){ init(); closeUploadDialog(); }, 1200);
    } else {
      var msg='上传失败';
      try{ var e=JSON.parse(xhr.responseText); msg=e.detail||e.error||msg; }catch(ex){}
      showToast(msg, true);
      document.getElementById('uploadProgress').style.display='none';
      btn.disabled=false;
    }
  };

  xhr.onerror=function(){
    showToast('上传失败: 网络错误', true);
    document.getElementById('uploadProgress').style.display='none';
    btn.disabled=false;
  };

  xhr.send(formData);
}

// ======== HISTORY ========
async function showHistory(){
  try{
    const r=await fetch('/api/history?limit=50');const data=await r.json();
    let h='';
    if(data.length===0) h='<div style="color:var(--text2);font-size:13px;padding:20px">暂无浏览记录</div>';
    else data.forEach(item=>{
      h+=`<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer" data-wp="${esc(item.work_path)}" class="history-item">
        <div style="font-weight:500">${esc(item.filename)}</div>
        <div style="color:var(--text2);font-size:10px">${item.opened_at||''}</div>
      </div>`;
    });
    document.getElementById('historyContent').innerHTML=h;
    document.getElementById('historyContent').querySelectorAll('.history-item').forEach(el=>{
      el.addEventListener('click',()=>{
        closeHistory();
        findAndShowDetail(el.dataset.wp);
      });
    });
    document.getElementById('historyPanel').classList.add('visible');
    document.getElementById('historyOverlay').classList.add('visible');
  }catch(e){showToast(e.message,true);}
}
function closeHistory(){document.getElementById('historyPanel').classList.remove('visible');document.getElementById('historyOverlay').classList.remove('visible');}
function findAndShowDetail(work_path){
  const idx=allItems.findIndex(c=>c.work_path===work_path);
  if(idx>=0) showDetail(idx);
}


// ======== STATS ========
async function showStats(){
  try{
    const [srcR,wkR]=await Promise.all([fetch('/api/stats/sources'),fetch('/api/stats/weekly')]);
    const srcData=await srcR.json(),wkData=await wkR.json();
    let h='';
    // Top sources
    if(srcData.sources?.length){
      h+='<div class="stats-chart"><h3>报告数量 Top 20 来源</h3>';
      const top20=srcData.sources.slice(0,20);
      const maxVal=top20[0]?.count||1;
      top20.forEach(s=>{
        const pct=Math.round(s.count/maxVal*100);
        const color=CAT_COLORS[s.cat_num]||'var(--accent)';
        h+=`<div class="bar-row"><span class="bar-label" title="${esc(s.source)}">${esc(s.source)}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div><span class="bar-value">${s.count}</span></div></div>`;
      });
      h+='</div>';
    }
    // Weekly trend
    if(wkData.weekly?.length){
      h+='<div class="stats-chart"><h3>每周报告数量趋势</h3>';
      // Aggregate by week
      const weekTotals={};
      wkData.weekly.forEach(w=>{weekTotals[w.week]=(weekTotals[w.week]||0)+w.count;});
      const maxW=Math.max(...Object.values(weekTotals),1);
      Object.entries(weekTotals).forEach(([week,cnt])=>{
        const pct=Math.round(cnt/maxW*100);
        h+=`<div class="bar-row"><span class="bar-label">${week.replace(/^\d+年/,'')}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--accent)"></div><span class="bar-value">${cnt}</span></div></div>`;
      });
      h+='</div>';
    }
    document.getElementById('statsContent').innerHTML=h;
    document.getElementById('statsPanel').classList.add('visible');
    document.getElementById('statsOverlay').classList.add('visible');
  }catch(e){showToast(e.message,true);}
}
function closeStats(){document.getElementById('statsPanel').classList.remove('visible');document.getElementById('statsOverlay').classList.remove('visible');}

// ======== DARK MODE ========
function toggleDarkMode(){
  const isDark=document.documentElement.dataset.theme==='dark';
  document.documentElement.dataset.theme=isDark?'light':'dark';
  document.getElementById('darkModeBtn').classList.toggle('active',!isDark);
  localStorage.setItem('doclib-theme',isDark?'light':'dark');
}

// ======== FILTER HANDLERS ========
function toggleCat(cat){activeCats.has(cat)?activeCats.delete(cat):activeCats.add(cat);syncCatBtns();updateSourceFilter();applyFilters();}
function syncCatBtns(){document.querySelectorAll('.cat-btn').forEach(b=>b.classList.toggle('active',activeCats.has(b.dataset.cat)));}
function clearSearch(){searchQuery='';document.getElementById('searchInput').value='';applyFilters();}
function clearSourceFilter(){activeSource='';document.getElementById('sourceSel').value='';applyFilters();}
function clearExtFilter(){activeExt='';document.getElementById('extSel').value='';applyFilters();}

// ======== UTILS ========
function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';if(b<1073741824)return(b/1048576).toFixed(1)+' MB';return(b/1073741824).toFixed(2)+' GB';}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function showToast(msg,err){
  const c=document.getElementById('toastContainer'),el=document.createElement('div');
  el.className='toast'+(err?' error':'');el.textContent=msg;c.appendChild(el);
  setTimeout(()=>{el.style.animation='toast-out .2s ease forwards';setTimeout(()=>el.remove(),300);},2500);
}

// ======== EVENT BINDINGS ========
document.addEventListener('DOMContentLoaded',()=>{
  init();
  document.getElementById('tableBody').addEventListener('scroll',onScroll);

  // Search with 300ms debounce
  let st;document.getElementById('searchInput').addEventListener('input',e=>{
    clearTimeout(st);st=setTimeout(()=>{searchQuery=e.target.value.trim();applyFilters();},300);
  });

  // Category buttons
  document.querySelectorAll('.cat-btn').forEach(b=>b.addEventListener('click',()=>toggleCat(b.dataset.cat)));

  // Week dropdown
  document.getElementById('weekDdBtn').addEventListener('click',()=>document.getElementById('weekDdList').classList.toggle('open'));
  document.addEventListener('click',e=>{if(!e.target.closest('.week-dd'))document.getElementById('weekDdList').classList.remove('open');});

  // Source & Ext
  document.getElementById('sourceSel').addEventListener('change',e=>{activeSource=e.target.value;applyFilters();});
  document.getElementById('extSel').addEventListener('change',e=>{activeExt=e.target.value;applyFilters();});

  // Multi-column sort: click = primary, Shift+click = add secondary
  document.querySelectorAll('#tableHeader .col[data-sort]').forEach(col=>{
    col.addEventListener('click',e=>{
      const key=col.dataset.sort, shift=e.shiftKey;
      if(shift){
        // Add/toggle secondary sort
        const existing=sortCols.findIndex(s=>s.col===key);
        if(existing>=0){sortCols[existing].dir=sortCols[existing].dir==='asc'?'desc':'asc';}
        else{sortCols.push({col:key,dir:key==='date'||key==='size'?'desc':'asc'});}
      } else {
        // Single column sort
        const existing=sortCols.find(s=>s.col===key);
        if(existing){sortCols=[{col:key,dir:existing.dir==='asc'?'desc':'asc'}];}
        else{sortCols=[{col:key,dir:key==='date'||key==='size'?'desc':'asc'}];}
      }
      applyFilters();
    });
  });

  // Select all
  document.getElementById('selectAll').addEventListener('change',e=>{
    if(e.target.checked)filteredItems.forEach(c=>selectedIds.add(wpIdx[c.work_path]));else selectedIds.clear();
    updateSelection();renderTable();
  });
  document.getElementById('clearSelBtn').addEventListener('click',()=>{selectedIds.clear();updateSelection();renderTable();});

  // Batch
  document.getElementById('batchBtn').addEventListener('click',showBatchDialog);
  document.getElementById('batchStartBtn').addEventListener('click',startBatchExtract);
  document.getElementById('batchCancelBtn').addEventListener('click',closeBatchDialog);

  // Panels
  document.getElementById('detailClose').addEventListener('click',closeDetail);
  document.getElementById('detailOverlay').addEventListener('click',closeDetail);
  document.getElementById('statsClose').addEventListener('click',closeStats);
  document.getElementById('statsOverlay').addEventListener('click',closeStats);
  document.getElementById('historyClose').addEventListener('click',closeHistory);
  document.getElementById('historyOverlay').addEventListener('click',closeHistory);

  // Upload
  document.getElementById('uploadStartBtn').addEventListener('click', startUpload);
  document.getElementById('uploadCancelBtn').addEventListener('click', closeUploadDialog);
  document.getElementById('uploadDialog').addEventListener('click', function(e){ if(e.target===this) closeUploadDialog(); });

  // Keyboard
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDetail();closeStats();closeHistory();closeBatchDialog();closeUploadDialog();}});

  // Resize
  window.addEventListener('resize',()=>renderTable());
});
</script>
</body>
