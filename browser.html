<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doc_Lib 文档目录浏览器</title>
<link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>

<!-- Loading -->
<div class="loading" id="loading">
  <div class="spinner"></div>
  <div>正在加载目录数据...</div>
</div>

<!-- Toasts -->
<div class="toast-container" id="toastContainer"></div>

<!-- App -->
<div class="app" id="app" style="display:none">

  <!-- Command Bar -->
  <div class="command-bar">
    <div class="command-left">
      <button class="cmd-btn primary" onclick="showUploadDialog()">
        <span class="icon">+</span> 上传
      </button>
      <button class="cmd-btn" id="batchBtn" disabled onclick="showBatchDialog()">
        <span class="icon">&#128203;</span> 批量提取
      </button>
      <button class="cmd-btn danger" id="batchDelBtn" disabled onclick="batchRecycle()">
        <span class="icon">&#128465;</span> 批量回收
      </button>
      <button class="cmd-btn" id="clearSelBtn" style="display:none" onclick="clearSel()">清除选择</button>
    </div>
    <div class="command-right">
      <div class="search-box">
        <span class="search-icon">&#128269;</span>
        <input type="text" id="searchInput" placeholder="搜索文件名..." />
      </div>
      <button class="cmd-btn" id="favFilterBtn" onclick="toggleFavFilter()" title="仅显示收藏">&#11088; 收藏</button>
      <button class="cmd-btn" id="historyBtn" onclick="showHistory()">&#128337;</button>
      <button class="cmd-btn" id="statsBtn" onclick="showStats()">&#128202;</button>
      <button class="cmd-btn" id="extractDirBtn" onclick="toggleExtractDir()">&#128193;</button>
      <button class="cmd-btn" id="darkModeBtn" onclick="toggleDarkMode()">&#9790;</button>
    </div>
  </div>

  <!-- Extract Dir Row -->
  <div class="extract-dir-row" id="extractDirRow" style="display:none;padding:4px 16px;background:var(--surface2);border-bottom:1px solid var(--border);gap:6px;align-items:center">
    <span style="font-size:13px;color:var(--text2);white-space:nowrap">提取到 </span>
    <input type="text" id="extractDirInput" style="flex:1;font-size:13px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text)" />
    <button class="btn-sm btn-extract" onclick="openExtractDir()">&#128194; 打开</button>
  </div>

  <!-- Main Layout -->
  <div class="main-layout">

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="nav-section">
        <div class="nav-header">
          年份
          <div class="nav-actions">
            <a onclick="sidebarYearChecked=new Set(yearOrder);rebuildSidebarCascade()">全选</a>
            <a onclick="sidebarYearChecked=new Set([yearOrder[0]]);rebuildSidebarCascade()">清空</a>
          </div>
        </div>
        <div id="yearNav"></div>
      </div>

      <div class="nav-section">
        <div class="nav-header">
          月份
          <div class="nav-actions">
            <a onclick="monthSelAll()">全选</a>
            <a onclick="monthSelNone()">清空</a>
          </div>
        </div>
        <div id="monthNav"></div>
      </div>

      <div class="nav-divider"></div>

      <div class="nav-section">
        <div class="nav-header">分类</div>
        <div id="catNav"></div>
      </div>

      <div class="nav-section" id="sourceSection" style="display:none">
        <div class="nav-header">来源</div>
        <select class="sel" id="sourceSel" style="width:100%;font-size:12px;padding:4px 6px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text);margin:4px 0">
          <option value="">全部来源</option>
        </select>
      </div>

      <div class="nav-section">
        <div class="nav-header">类型</div>
        <select id="extNav" style="width:100%;font-size:12px;padding:4px 6px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text);margin:4px 0">
          <option value="">全部</option>
        </select>
      </div>

      <div class="nav-bottom">
        <div class="nav-link" id="recycleBtn" onclick="showRecycleStatus()">
          <span class="icon">&#128465;</span> 回收站
        </div>
      </div>
    </div>

    <!-- Content -->
    <div class="content">

      <!-- Active Filters -->
      <div class="active-filters" id="activeFilters"></div>

      <!-- Table -->
      <div class="table-wrap">
        <div class="table-header" id="tableHeader">
          <div class="col"><input type="checkbox" id="selectAll" title="全选" /></div>
          <div class="col" data-sort="cat_num">分类 <span class="arrow"></span></div>
          <div class="col" data-sort="source">来源 <span class="arrow"></span></div>
          <div class="col" data-sort="filename">文件名 <span class="arrow"></span></div>
          <div class="col" data-sort="pages">页</div>
          <div class="col" data-sort="size">大小 <span class="arrow"></span></div>
          <div class="col" data-sort="date">日期 <span class="arrow"></span></div>
          <div class="col">类型</div>
          <div class="col actions-col">操作</div>
        </div>
        <div class="table-body" id="tableBody">
          <div class="table-spacer" id="tableSpacer"></div>
          <div class="table-rows" id="tableRows"></div>
        </div>
      </div>

      <!-- Status Bar -->
      <div class="status-bar">
        <span class="count">共 <span id="totalCount">--</span></span>
        <span class="count">| 筛选 <span id="filteredCount">--</span></span>
        <span class="sel-info hidden" id="selCount" style="margin-left:12px"></span>
        <span class="sel-info hidden" id="selSize" style="color:var(--text2)"></span>
        <span style="flex:1"></span>
        <span class="count" id="statsText"></span>
      </div>

    </div>
  </div>
</div>

<!-- Detail Panel -->
<div class="overlay" id="detailOverlay"></div>
<div class="panel" id="detailPanel">
  <button class="panel-close" id="detailClose">&times;</button>
  <h2 id="detailTitle"></h2>
  <div id="detailContent"></div>
</div>

<!-- Stats Panel -->
<div class="overlay" id="statsOverlay"></div>
<div class="stats-panel" id="statsPanel">
  <button class="panel-close" id="statsClose">&times;</button>
  <h2>来源统计</h2>
  <div id="statsContent"></div>
</div>

<!-- History Panel -->
<div class="overlay" id="historyOverlay"></div>
<div class="panel" id="historyPanel">
  <button class="panel-close" id="historyClose">&times;</button>
  <h2>浏览历史</h2>
  <div id="historyContent"></div>
</div>

<!-- Batch Extract Dialog -->
<div class="dialog-overlay" id="batchDialog">
  <div class="dialog">
    <h3>批量提取文件</h3>
    <div class="file-list" id="batchFileList"></div>
    <div class="field">
      <label>提取到目录（自动创建时间戳子目录）</label>
      <input type="text" id="batchTargetDir" />
    </div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:10px">
      实际提取到: <span id="batchActualDir" style="font-family:monospace;font-size:11px"></span>
    </div>
    <div class="field">
      <label>预设目录</label>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">
        <button class="btn-sm" style="background:var(--badge-bg);color:var(--text);border:1px solid var(--border);font-size:12px" onclick="setBatchDir(getExtractDir())">提取目录</button>
        <button class="btn-sm" style="background:var(--badge-bg);color:var(--text);border:1px solid var(--border);font-size:12px" onclick="setBatchDir(getExtractDir()+'/券商')">券商</button>
        <button class="btn-sm" style="background:var(--badge-bg);color:var(--text);border:1px solid var(--border);font-size:12px" onclick="setBatchDir(getExtractDir()+'/投行')">投行</button>
      </div>
    </div>
    <div id="batchProgress" style="display:none">
      <div class="progress-bar"><div class="fill" id="batchProgressFill"></div></div>
      <div class="progress-text" id="batchProgressText"></div>
    </div>
    <div class="actions">
      <button class="btn-sm" style="font-size:13px;padding:6px 14px;background:var(--badge-bg);color:var(--text);border:1px solid var(--border)" id="batchCancelBtn">取消</button>
      <button class="btn-sm btn-open" style="font-size:13px;padding:6px 14px" id="batchStartBtn">开始提取</button>
    </div>
  </div>
</div>

<!-- Delete Confirm Dialog -->
<div class="dialog-overlay" id="deleteDialog">
  <div class="dialog delete-confirm">
    <h3>移至回收站</h3>
    <div class="warning">
      文件将被移动到回收站 (<code>.recycle_bin/</code>)，可从回收站恢复。
    </div>
    <div>以下 <b id="deleteCount">0</b> 个文件将被回收：</div>
    <div class="file-list" id="deleteFileList" style="margin-top:8px"></div>
    <div class="actions">
      <button class="btn-sm" style="font-size:13px;padding:6px 14px;background:var(--badge-bg);color:var(--text);border:1px solid var(--border)" onclick="closeDeleteDialog()">取消</button>
      <button class="btn-sm btn-danger" style="font-size:13px;padding:6px 14px" onclick="confirmDeleteAction()">移至回收站</button>
    </div>
  </div>
</div>

<!-- Upload Dialog -->
<div class="dialog-overlay" id="uploadDialog">
  <div class="dialog">
    <h3>添加新数据</h3>
    <div class="field">
      <label>选择 ZIP 文件</label>
      <div style="border:2px dashed var(--border);border-radius:8px;padding:24px;text-align:center;cursor:pointer;margin-top:4px;transition:border .2s"
           id="uploadDropZone"
           ondragover="this.style.borderColor='var(--accent)';event.preventDefault()"
           ondragleave="this.style.borderColor='var(--border)'"
           ondrop="handleFileDrop(event)"
           onclick="document.getElementById('uploadFileInput').click()">
        <div style="font-size:32px;margin-bottom:6px">&#128230;</div>
        <div style="font-size:14px;color:var(--text)" id="uploadFileName">拖拽一个或多个 ZIP 文件到此处或点击选择</div>
        <div style="font-size:12px;color:var(--text2);margin-top:4px">仅支持 .zip 文件，单个上限 8 GB，可多选</div>
        <input type="file" id="uploadFileInput" accept=".zip" multiple style="display:none" onchange="handleFileSelect(event)" />
      </div>
    </div>
    <div id="uploadFileList" style="margin-top:8px;max-height:180px;overflow-y:auto;display:none"></div>
    <div id="uploadProgress" style="display:none;margin-top:8px">
      <div class="progress-bar"><div class="fill" id="uploadProgressFill"></div></div>
      <div class="progress-text" id="uploadProgressText"></div>
    </div>
    <div class="actions">
      <button class="btn-sm" style="font-size:13px;padding:6px 14px;background:var(--badge-bg);color:var(--text);border:1px solid var(--border)" id="uploadCancelBtn">取消</button>
      <button class="btn-sm btn-open" style="font-size:13px;padding:6px 14px" id="uploadStartBtn" disabled>上传并添加到目录</button>
    </div>
  </div>
</div>

<!-- Scripts — loaded in dependency order -->
<script src="/static/js/app.js"></script>
<script src="/static/js/filters.js"></script>
<script src="/static/js/table.js"></script>
<script src="/static/js/dialogs.js"></script>
<script src="/static/js/upload.js"></script>

<script>
// ======== EVENT BINDINGS ========
document.addEventListener('DOMContentLoaded',()=>{
  init();

  // Table scroll with header horizontal sync
  const tableBody=document.getElementById('tableBody');
  const tableHeader=document.getElementById('tableHeader');
  tableBody.addEventListener('scroll',()=>{
    tableHeader.scrollLeft=tableBody.scrollLeft;
    onScroll();
  });

  // Search with 300ms debounce
  let st;
  document.getElementById('searchInput').addEventListener('input',e=>{
    clearTimeout(st);
    st=setTimeout(()=>{searchQuery=e.target.value.trim();applyFilters();},300);
  });

  // Source & Ext changes
  document.getElementById('sourceSel').addEventListener('change',e=>{activeSource=e.target.value;applyFilters();});
  document.getElementById('extNav').addEventListener('change',e=>{activeExt=e.target.value;applyFilters();});

  // Multi-column sort
  document.querySelectorAll('#tableHeader .col[data-sort]').forEach(col=>{
    col.addEventListener('click',e=>{
      const key=col.dataset.sort, shift=e.shiftKey;
      if(shift){
        const existing=sortCols.findIndex(s=>s.col===key);
        if(existing>=0){sortCols[existing].dir=sortCols[existing].dir==='asc'?'desc':'asc';}
        else{sortCols.push({col:key,dir:key==='date'||key==='size'?'desc':'asc'});}
      } else {
        const existing=sortCols.find(s=>s.col===key);
        if(existing){sortCols=[{col:key,dir:existing.dir==='asc'?'desc':'asc'}];}
        else{sortCols=[{col:key,dir:key==='date'||key==='size'?'desc':'asc'}];}
      }
      applyFilters();
    });
  });

  // Select all
  document.getElementById('selectAll').addEventListener('change',e=>{
    if(e.target.checked) filteredItems.forEach(c=>selectedIds.add(c.work_path));
    else selectedIds.clear();
    updateSelection(); renderTable();
  });

  // Batch buttons
  document.getElementById('batchBtn').addEventListener('click',showBatchDialog);
  document.getElementById('batchDelBtn').addEventListener('click',batchRecycle);
  document.getElementById('batchStartBtn').addEventListener('click',startBatchExtract);
  document.getElementById('batchCancelBtn').addEventListener('click',closeBatchDialog);

  // Panel close
  document.getElementById('detailClose').addEventListener('click',closeDetail);
  document.getElementById('detailOverlay').addEventListener('click',closeDetail);
  document.getElementById('statsClose').addEventListener('click',closeStats);
  document.getElementById('statsOverlay').addEventListener('click',closeStats);
  document.getElementById('historyClose').addEventListener('click',closeHistory);
  document.getElementById('historyOverlay').addEventListener('click',closeHistory);

  // Upload
  document.getElementById('uploadStartBtn').addEventListener('click', startUpload);
  document.getElementById('uploadCancelBtn').addEventListener('click', closeUploadDialog);
  document.getElementById('uploadDialog').addEventListener('click', function(e){ if(e.target===this) closeUploadDialog(); });

  // Extract dir input
  const extInput=document.getElementById('extractDirInput');
  extInput.value=getExtractDir();
  extInput.addEventListener('change',()=>saveExtractDir(extInput.value));
  extInput.addEventListener('blur',()=>saveExtractDir(extInput.value));

  // Keyboard
  document.addEventListener('keydown',e=>{if(e.key==='Escape') closeAllPanels();});

  // Column resize
  initColumnResize();
  window.addEventListener('resize',()=>renderTable());
});

function clearSel(){selectedIds.clear();updateSelection();renderTable();}

function showRecycleStatus(){
  showToast('回收站位于: work/.recycle_bin/ （可手动恢复文件）');
}
</script>
</body>
</html>
